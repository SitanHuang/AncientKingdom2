<button onclick="download(prompt('File name', 'scenario') + '.json',
    serialize({data: data, civs: civs, military: military}, {space: 0}))">Export(JSON)</button>
<input type="file" id="file" accept="application/json">
<script>
    function readSingleFile(evt) {
        //Retrieve the first (and only!) File from the FileList object
        var f = evt.target.files[0];

        if (f) {
            var r = new FileReader();
            r.onload = function (e) {
                var contents = e.target.result;
                var scenario = eval('(' + contents + ')');
                data = scenario.data;
                civs = scenario.civs;
                military = scenario.military || {};
                popv2_init();
                Military.init(military);
                Military.migrateLegacyCells();
                normalizeCellTypes();
                endTurn();
                scenario = null;
            };
            r.readAsText(f);
        } else {
            alert("Failed to load file");
        }
    }

    $(function () {
        $('#file').change(readSingleFile)
    })
</script>
<button onclick="landLevel = parseInt(prompt())">set land expand level</button>
